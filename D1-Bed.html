<!DOCTYPE html>
<html>
<head>
<title>Day 1-Room Exploration</title>
<style>
html, body {
	font-family: Courier, monospace;
	color: #F2F2F2;
	background-color: black;
	margin: 0;
	height: 100%;
	}

/* Main container */
.bg {
  position: relative;
  background-image: url(game-img/hospitalroom.png);
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  height: 100%;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
  
}

.hotspots {
	position: absolute;
	width: 100%;
	height: 100%;
	top: 0%;
	left: 0%;
	z-index: 3;
}

.character-img {
	position: absolute;
	justify-content: center;
	display: flex;
	bottom: 0;
	width: 100%;
	height: 100%;
	left: 50%;
	transform: translateX(-50%);
	max-width: 30%;
	z-index: 4;
}

.dialoguebox {
	position: absolute;
	bottom: 0;
	left: 300px;
	width: 40%;
	height: 10%;
	margin: 50px;
	padding: 20px;
	border: 1px solid white;
	display: flex;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	background-color: black;
	opacity: 70%;
	z-index: 5;
	}

.character-name {
	position: absolute;
	text-align: center;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: black;
	opacity: 100%;
	top: -35px;
	left: 0;
	width: 30%;
	height: 30px;
	color: #F2F2F2;
	border: 1px solid white;
	cursor: default;
	}

@media (min-width: 1200px) {
	.character-name {
		width: 20%;
		height: 28px;
		top: -32px;
		font-size: 1rem;
	}
}

#text {
	font-size: 20px;
	text-align: center;
	min-height: 30px;
	}

.red-text {
	color: red !important;
	}

@keyframes blink {
	50% { opacity: 0; }
	}
</style>
</head>

<body>
<div class="bg">
	<img src="game-img/hospitalroom.png"
	<div class="hotspots">
		\\ Hospital Room Door \\
		<a href="D1-Door.html"
		title="Check doorway area..."
		class="hotspot"
		style="
		  left: 0%;
		  width: 10%;
		  height: 30%;
		">
		<img src="game-img/cabinet1.png"
		</a>"
	</div>
</body>
