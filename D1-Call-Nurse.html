<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Day 1-Room Exploration</title>
<style>
html, body {
	font-family: Courier, monospace;
	color: #F2F2F2;
	background-color: black;
	margin: 0;
	height: 100%;
	}

.bg {
  position: relative;
  background-image: url(game-img/hospitalroom-door.png);
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  height: 100%;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

.character-img {
	position: absolute;
	justify-content: center;
	display: flex;
	bottom: 0;
	width: 100%;
	height: 100%;
	left: 50%;
	transform: translateX(-50%);
	max-width: 30%;
	z-index: 4;
}

.dialoguebox {
	position: absolute;
	bottom: 0;
	left: 300px;
	width: 40%;
	height: 10%;
	margin: 50px;
	padding: 20px;
	border: 1px solid white;
	display: flex;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	background-color: black;
	opacity: 70%;
	z-index: 5;
	}

.character-name {
	position: absolute;
	text-align: center;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: black;
	opacity: 100%;
	top: -35px;
	left: 0;
	width: 30%;
	height: 30px;
	color: #F2F2F2;
	border: 1px solid white;
	cursor: default;
	}

@media (min-width: 1200px) {
	.character-name {
		width: 20%;
		height: 28px;
		top: -32px;
		font-size: 1rem;
	}
}

#text {
	font-size: 20px;
	text-align: center;
	min-height: 30px;
	}

@keyframes blink {
	50% { opacity: 0; }
	}
</style>
</head>

<body>
<div class="bg">

	<div class="character-img">
		<img id="characterImg" src="game-img/Nurse-Talk.png">
		</div>

	<div class="dialoguebox" id="box">
	<div class="character-name" id="name"></div>
	<div id="text"></div>
</div>

<script>
	const dialogue = [
		"You called?",
		"Your visitors are ready for you.",
		"Did you finish looking around?",
	]

let index = 0;
let typing = false;
const textEl = document.getElementById("text");
const box = document.getElementById("box");
const nameEl = document.getElementById("name");
document.getElementById("characterImg").src = "game-img/Nurse-Talk.png";
nameEl.innerHTML = "Nurse";
box.addEventListener("click", next);

function typeLine(line) {
	typing = true;
	textEl.innerHTML = "";
	let i = 0;
	const interval = setInterval(() => 
		{
		textEl.innerHTML += line[i];
		i++;
		if (i >= line.length) {
			clearInterval(interval);
			typing = false;
		}
	}, 35);

} function next() {
	if (typing) return;
	index++;
	if (index >= dialogue.length) {
		textEl.innerHTML = `
		<button onclick="window.location.href='D1-Mother.html'">Yes</button>
		<button onclick="window.location.href='D1-Door.html'">No</button>
		`;
		box.removeEventListener("click", next);
		return;
	}
	typeLine(dialogue[index]);
}
typeLine(dialogue[index]);

</script>


</body>
</html>
