<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Day 1-Room Exploration</title>
<style>
html, body {
	font-family: Courier, monospace;
	color: #F2F2F2;
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	}

/* Main container */
.bg {
	position: relative;
	width: 100vw;
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.room-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hotspots {
	position: absolute;
	top: 0%;
	left: 0%;
	z-index: 3;
	width: 1920px;
  	height: 1080px;

 	transform-origin: top left;

 	transform: scale(
    calc(100vw / 1920),
    calc(100vh / 1080)
	);
}

.hotspot {
	position: absolute;
  	cursor: pointer;
	background: transparent;
}

.hotspot:hover {
 	background: rgba(255, 0, 0, 0.25);
}

.character-img {
	position: absolute;
	justify-content: center;
	display: flex;
	bottom: 0;
	width: 100%;
	height: 100%;
	left: 50%;
	transform: translateX(-50%);
	max-width: 30%;
	z-index: 4;
}

.dialoguebox {
	position: absolute;
	bottom: 0;
	left: 300px;
	width: 40%;
	height: 10%;
	margin: 50px;
	padding: 20px;
	border: 1px solid white;
	display: flex;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	background-color: black;
	opacity: 70%;
	z-index: 5;
	}

.character-name {
	position: absolute;
	text-align: center;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: black;
	opacity: 100%;
	top: -35px;
	left: 0;
	width: 30%;
	height: 30px;
	color: #F2F2F2;
	border: 1px solid white;
	cursor: default;
	}

@media (min-width: 1200px) {
	.character-name {
		width: 20%;
		height: 28px;
		top: -32px;
		font-size: 1rem;
	}
}

#text {
	font-size: 20px;
	text-align: center;
	min-height: 30px;
	}

@keyframes blink {
	50% { opacity: 0; }
	}
</style>
</head>

<script>
function scaleHotspots() {
  const scaleX = window.innerWidth / 1920;
  const scaleY = window.innerHeight / 1080;

  const el = document.querySelector('.hotspots');
  el.style.transform = `scale(${scaleX}, ${scaleY})`;
}

window.addEventListener('resize', scaleHotspots);
window.addEventListener('load', scaleHotspots);
</script>

<body>
<div class="bg">
	<img src="game-img/hospitalroom-door.png" class="room-img">
	<div class="hotspots">
		<!--Hospital Room Door--->
		<a href="D1-Bed.html"
		title="Return to bed..."
		class="hotspot"
		style="
		 	top: 0px; 
		  right: 0px;
		  width: 384px;
		  height: 1080px;
		">
		</a>
		<!--Bathroom--->
		<a href="D1-Bathroom.html"
		title="Check bathroom..."
		class="hotspot"
		style="
		  left: 730px;
		  top: 216px;
		  width: 135px;
		  height: 540px;
		">
		</a>
		<!--Entrance--->
		<a href="D1-Entrance.html"
		title="Tell the nurse you're ready for guests."
		class="hotspot"
		style="
		  left: 384px;
		  top: 346px;
		  width: 211px;
		  height: 454px;
		">
		</a>
	</div>
</body>
