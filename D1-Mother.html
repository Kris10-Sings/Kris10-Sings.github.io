function typeLine(line) {
	typing = true;
	textEl.innerHTML = "";
	let i = 0;
	const interval = setInterval(() => 
		{
		// Check if we're at an HTML tag
		if (line[i] === '<') {
			// Find the end of the tag
			let j = i;
			while (j < line.length && line[j] !== '>') {
				j++;
			}
			// Add the entire tag as one unit
			textEl.innerHTML += line.slice(i, j + 1);
			i = j + 1;
		} else {
			textEl.innerHTML += line[i];
			i++;
		}
		if (i >= line.length) {
			clearInterval(interval);
			typing = false;
		}
	}, 35); 
}
